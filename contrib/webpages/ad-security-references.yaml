# Active Directory / Entra ID security reference pages.
#
# Curated from the external references cited by an AD/M365 security assessment
# toolkit: MITRE ATT&CK technique pages, Microsoft reference pages that are not
# covered by a gitdocs Microsoft Learn repository, NIST SP 800-63B, and the
# canonical public research write-ups for common AD attack techniques.
# Microsoft Learn pages for Entra, Windows Server, troubleshooting, Azure,
# Microsoft 365 and the privileged access (security) docs are indexed by the
# gitdocs provider and are intentionally not repeated here.
#
# Install: copy to <data-dir>/webpages/ad-security-references.yaml, then
#   knowledge-mcp dataset download ad-security-references
name: AD security references
description: Active Directory and Entra ID security reference pages - MITRE ATT&CK technique pages, Microsoft security policy and permission references, NIST SP 800-63B, and published AD security research cited in assessment findings.
project: AD security
language: en
topics: [Active Directory, Entra ID, MITRE ATT&CK, Kerberos, AD CS, security assessment, hardening]
concurrency: 2
delay: 1s
